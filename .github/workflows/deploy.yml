name: Deploy EnglishLearning

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      prune:
        description: "Delete remote files that no longer exist in the repository"
        required: false
        default: false
        type: boolean

concurrency:
  group: english-learning-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Aliyun
    runs-on: ubuntu-latest
    environment: ALIYUN
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Setup Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Validate backend
        run: |
          for file in backend/src/*.js; do
            node --check "$file"
          done

      - name: Build frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || vars.NEXT_PUBLIC_API_BASE_URL || 'same-origin' }}
        run: |
          cd frontend
          yarn install --frozen-lockfile
          yarn build

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.ALIYUN_HOST || secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.ALIYUN_USER || secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.ALIYUN_PORT || secrets.SSH_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.ALIYUN_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
        run: |
          test -n "$SSH_HOST" || { echo "Missing secret: ALIYUN_HOST or SSH_HOST"; exit 1; }
          test -n "$SSH_USER" || { echo "Missing secret: ALIYUN_USER or SSH_USER"; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo "Missing secret: ALIYUN_SSH_KEY or SSH_PRIVATE_KEY"; exit 1; }

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/aliyun_deploy_key
          chmod 600 ~/.ssh/aliyun_deploy_key

          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host aliyun-deploy
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/aliyun_deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

      - name: Upload release files
        env:
          REMOTE_DIR: ${{ vars.REMOTE_DIR || '/var/www/english-learning' }}
          PRUNE: ${{ github.event.inputs.prune || 'false' }}
        run: |
          backend_rsync_args=(-az)
          if [[ "$PRUNE" == "true" ]]; then
            backend_rsync_args+=(--delete)
          fi

          ssh aliyun-deploy "mkdir -p '$REMOTE_DIR/backend' '$REMOTE_DIR/frontend/dist' '$REMOTE_DIR/deploy/nginx'"

          rsync "${backend_rsync_args[@]}" \
            --exclude ".env" \
            --exclude "data/*.db" \
            --exclude "data/*.db-shm" \
            --exclude "data/*.db-wal" \
            backend/ "aliyun-deploy:$REMOTE_DIR/backend/"

          rsync -az --delete frontend/dist/ "aliyun-deploy:$REMOTE_DIR/frontend/dist/"
          rsync -az deploy/nginx/english-learning.conf "aliyun-deploy:$REMOTE_DIR/deploy/nginx/english-learning.conf"

      - name: Restart server
        env:
          REMOTE_DIR: ${{ vars.REMOTE_DIR || '/var/www/english-learning' }}
          NODE_BIN_DIR: ${{ vars.NODE_BIN_DIR || '/opt/node-v24.11.0-linux-x64/bin' }}
          BACKEND_APP: english-learning-backend
          NGINX_CONF_PATH: ${{ vars.NGINX_CONF_PATH || '/etc/nginx/conf.d/english-learning.conf' }}
        run: |
          ssh aliyun-deploy "set -e
          export PATH='$NODE_BIN_DIR':\$PATH

          cd '$REMOTE_DIR'
          pm2 describe '$BACKEND_APP' >/dev/null 2>&1 \
            && pm2 restart '$BACKEND_APP' --update-env \
            || pm2 start '$NODE_BIN_DIR/node' --name '$BACKEND_APP' --cwd '$REMOTE_DIR' -- backend/src/server.js

          pm2 describe english-learning-frontend >/dev/null 2>&1 && pm2 delete english-learning-frontend || true

          cp '$REMOTE_DIR/deploy/nginx/english-learning.conf' '$NGINX_CONF_PATH'
          nginx -t
          nginx -s reload
          pm2 save
          pm2 list
          "
